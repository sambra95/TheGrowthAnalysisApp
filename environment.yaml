name: growth_curves_app_env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - plotly
  - streamlit
  - openpyxl # .xlsx support
  - xlrd # .xls support (legacy)
  - streamlit-plotly-events
  - pip:
      - kaleido # optional: static image export for plotly (nice to have)
